<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Silvia's Pac-Man Contributions</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #f0f6fc;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #8b949e;
    }

    #game {
      width: min(1100px, 95vw);
      margin-top: 30px;
    }

    .back {
      margin-top: 30px;
      color: #58a6ff;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <h1>Silvia's Contribution Pac-Man</h1>

  <p>
    Pac-Man exploring my GitHub contributions
  </p>

  <div id="game"></div>

  <a
    class="back"
    href="https://github.com/Silvia-SB"
  >
    ← Back to GitHub profile
  </a>

  <script src="https://cdn.jsdelivr.net/npm/pacman-contribution-graph/dist/pacman-contribution-graph.min.js"></script>

  <script type="module">
    import {
      ArcadeRenderer
    } from "https://cdn.jsdelivr.net/npm/pacman-contribution-graph/dist/pacman-contribution-graph.min.js";

    const gameContainer = document.getElementById("game");

    const renderer = new ArcadeRenderer({
      game: "pacman",
      username: "Silvia-SB",
      platform: "github",
      gameTheme: "github-dark",

      svgCallback: (svg) => {
        gameContainer.innerHTML = svg;
      },

      gameOverCallback: () => {
        console.log("Game finished");
      },

      gameStatsCallback: (stats) => {
        console.log(stats);
      }
    });

    renderer.start();
  </script>

</body>
</html>
